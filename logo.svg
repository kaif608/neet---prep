<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Space Galaxy) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gold/Cyan Gradient for Icons and Text -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a18cd1"/>
      <stop offset="100%" stop-color="#fbc2eb"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base (Rounded Square with smooth iOS/Android style curve) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Background Star Sparkles -->
  <circle cx="100" cy="120" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="410" cy="90" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="430" cy="380" r="3.5" fill="#38ef7d" opacity="0.9"/>
  <circle cx="90" cy="400" r="2" fill="#fbc2eb" opacity="0.7"/>

  <!-- Central Glowing Cosmic Orbit / Target Ring -->
  <ellipse cx="256" cy="230" rx="140" ry="50" fill="none" stroke="rgba(161, 140, 209, 0.25)" stroke-width="4" transform="rotate(-15 256 230)"/>
  <ellipse cx="256" cy="230" rx="100" ry="35" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6" transform="rotate(25 256 230)"/>

  <!-- Graduation / Study Cap (Icon) -->
  <g transform="translate(0, 15)">
    <!-- Cap Diamond Top -->
    <polygon points="256,120 400,180 256,240 112,180" fill="url(#goldGrad)" filter="url(#glow)"/>
    <!-- Cap Base Band -->
    <path d="M 175,215 L 175,275 C 175,305 337,305 337,275 L 337,215" fill="none" stroke="#11998e" stroke-width="14" stroke-linecap="round"/>
    <!-- Tassel -->
    <path d="M 325,200 Q 360,230 350,280" fill="none" stroke="#fbc2eb" stroke-width="6" stroke-linecap="round"/>
    <circle cx="350" cy="285" r="7" fill="#fbc2eb"/>
  </g>

  <!-- Glowing Star in Center / Spark of Knowledge -->
  <path d="M256,170 L264,195 L289,203 L264,211 L256,236 L248,211 L223,203 L248,195 Z" fill="#ffffff" filter="url(#glow)"/>

  <!-- App Title Text on Icon -->
  <text x="256" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">NEET PREP</text>
  <text x="256" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#38ef7d" text-anchor="middle" letter-spacing="4">HUB</text>
</svg>
